        rel="stylesheet">
    <title>🌸</title>

    <style>
        .flower-message {
            all: unset !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            gap: 0.5rem !important;
            position: fixed !important;
            top: 4vh !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            width: 92vw !important;
            max-width: 560px !important;
            text-align: center !important;
            z-index: 1000 !important;
            padding: 0 !important;
            background: none !important;
            border: none !important;
            box-shadow: none !important;
            border-radius: 0 !important;
            transition: opacity 1.8s ease !important;
        }

        #line1 {
            font-family: 'Dancing Script', cursive !important;
            font-size: clamp(2.2rem, 8vw, 4rem) !important;
            font-weight: 700 !important;
            color: transparent !important;
            background: linear-gradient(135deg, #ffccd8 0%, #ff7aa2 50%, #ffb347 100%) !important;
            -webkit-background-clip: text !important;
            background-clip: text !important;
            text-shadow: none !important;
            filter: drop-shadow(0 2px 22px rgba(255, 100, 150, 0.65)) !important;
            line-height: 1.15 !important;
            margin: 0 !important;
            min-height: 1.2em;
        }

        #divider {
            font-size: 0.65rem !important;
            letter-spacing: 0.75em !important;
            color: rgba(255, 195, 215, 0.5) !important;
            font-weight: 300;
            min-height: 1em;
        }

        #line2 {
            font-family: 'Cormorant Garamond', serif !important;
            font-size: clamp(0.92rem, 2.6vw, 1.2rem) !important;
            font-weight: 300 !important;
            font-style: italic !important;
            color: rgba(255, 235, 245, 0.92) !important;
            text-shadow: 0 0 22px rgba(255, 140, 175, 0.5), 0 2px 10px rgba(0, 0, 0, 0.55) !important;
            line-height: 1.95 !important;
            margin: 0 !important;
            padding: 0 0.4rem;
            min-height: 1.2em;
        }

        #line3 {
            font-family: 'Dancing Script', cursive !important;
            font-size: clamp(1rem, 2.8vw, 1.25rem) !important;
            font-weight: 500 !important;
            color: rgba(255, 200, 140, 0.88) !important;
            text-shadow: 0 0 16px rgba(255, 185, 90, 0.5), 0 1px 6px rgba(0, 0, 0, 0.45) !important;
            letter-spacing: 0.03em !important;
            margin: 0.1rem 0 0 !important;
            font-style: italic;
            min-height: 1.2em;
        }

        /* Cursor parpadeante */
        .cursor {
            display: inline-block;
            width: 1.5px;
            height: 0.85em;
            background: rgba(255, 175, 205, 0.95);
            vertical-align: middle;
            margin-left: 1px;
            border-radius: 1px;
            animation: blink .7s step-end infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        /* fade in por línea */
        .line-hidden {
            opacity: 0;
            transition: opacity 0.7s ease;
        }

        .line-visible {
            opacity: 1 !important;
        }

        /* Botón replay */
        .replay-btn {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: transparent;
            border: 1px solid rgba(255, 165, 195, 0.3);
            color: rgba(255, 215, 228, 0.55);
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1rem;
            letter-spacing: 0.12em;
            padding: 0.5rem 2rem;
            border-radius: 100px;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: opacity .8s, border-color .3s, color .3s, box-shadow .3s;
        }

        .replay-btn.visible {
            opacity: 1;
            pointer-events: all;
        }

        .replay-btn:hover {
            border-color: rgba(255, 140, 175, .75);
            color: #fff;
            box-shadow: 0 0 22px rgba(255, 130, 170, .22);
        }

        /* ══════════════════════════════════════
           GATO ANIMADO (CSS puro)
        ══════════════════════════════════════ */
        .cat-wrap {
            position: relative;
            margin-top: 2rem;
            z-index: 1001;
            opacity: 0;
            transition: opacity 1s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .cat-wrap.visible {
            opacity: 1;
        }

        /* Burbuja de corazón */
        .cat-bubble {
            background: rgba(255, 200, 220, 0.18);
            border: 1px solid rgba(255, 160, 190, 0.3);
            border-radius: 12px 12px 12px 2px;
            padding: 4px 10px;
            font-size: 1rem;
            animation: bubble-float 2s ease-in-out infinite alternate;
            backdrop-filter: blur(4px);
        }

        @keyframes bubble-float {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-5px);
            }
        }

        /* SVG del gato */
        .cat-svg {
            width: 90px;
            height: 90px;
        }

        /* Orejas */
        .ear-left,
        .ear-right {
            animation: ear-twitch 4s ease-in-out infinite;
            transform-origin: bottom center;
        }

        .ear-right {
            animation-delay: 0.3s;
        }

        @keyframes ear-twitch {

            0%,
            90%,
            100% {
                transform: rotate(0deg);
            }

            92% {
                transform: rotate(-8deg);
            }

            96% {
                transform: rotate(6deg);
            }
        }

        /* Ojos — parpadeo */
        .eye-left,
        .eye-right {
            animation: blink-cat 4s ease-in-out infinite;
            transform-origin: center;
        }

        .eye-right {
            animation-delay: 0.08s;
        }

        @keyframes blink-cat {

            0%,
            45%,
            55%,
            100% {
                transform: scaleY(1);
            }

            50% {
                transform: scaleY(0.05);
            }
        }

        /* Corazones en los ojos */
        .heart-eye {
            animation: heart-pulse 1.2s ease-in-out infinite;
        }

        @keyframes heart-pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.18);
            }
        }

        /* Cola */
        .tail {
            animation: tail-wag 1.4s ease-in-out infinite;
            transform-origin: top left;
        }

        @keyframes tail-wag {

            0%,
            100% {
                transform: rotate(0deg);
            }

            30% {
                transform: rotate(18deg);
            }

            70% {
                transform: rotate(-10deg);
            }
        }

        /* Patas — cuerpo rebota suavemente */
        .cat-body-g {
            animation: body-bounce 1.4s ease-in-out infinite;
            transform-origin: bottom center;
        }

        @keyframes body-bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-3px);
            }
        }

        /* Bigotes */
        .whisker {
            animation: whisker-move 3s ease-in-out infinite alternate;
            transform-origin: center left;
        }

        .whisker.right {
            transform-origin: center right;
        }

        @keyframes whisker-move {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(5deg);
            }
        }

        /* Pequeñas estrellitas alrededor del gato */
        .cat-star {
            position: absolute;
            font-size: 0.65rem;
            animation: star-orbit var(--dur, 3s) var(--del, 0s) ease-in-out infinite alternate;
            color: rgba(255, 180, 210, 0.75);
        }

        @keyframes star-orbit {
            from {
                transform: translate(0, 0) scale(0.8);
                opacity: 0.4;
            }

            to {
                transform: translate(var(--tx, 6px), var(--ty, -8px)) scale(1.2);
                opacity: 1;
            }
        }
    </style>
</head>

    <button class="replay-btn" id="replayBtn" onclick="startSequence()">Leer otra vez 🌸</button>

    <script src="main.js"></script>
    <script>
        /* ─── Texto del mensaje ─── */
        const STEPS = [
            {
                id: 'line1',
                text: 'Para Manuela Fria 🌸',
                speed: 85,
                pause: 0
            },
            {
                id: 'divider',
                text: null,
                pause: 350
            },
            {
                id: 'line2',

                text: 'Eres la persona más bonita que tengo en mi vida. Iluminas mis días sin darte cuenta, y eso es lo que más me gusta de tiiii. <3 \n\nGracias por quererme tantooo, por reír conmigo y por convertirte en mi lugar favorito... y sobre todo, como dice la canción: "Te estás volviendo mi lugar seguro." 🎵',
                speed: 32,
                pause: 400
            },
            {
                id: 'line3',
                text: '— Con todo mi amor, Anthony Guzman 💛',
                speed: 65,
                pause: 700
            }
        ];

        let activeTimer = null;

        function typeInto(el, text, speed, done) {
            let i = 0;
            const cur = document.createElement('span');
            cur.className = 'cursor';
            el.appendChild(cur);

            function tick() {
                if (i < text.length) {
                    const ch = text[i++];
                    if (ch === '\n') {
                        cur.insertAdjacentHTML('beforebegin', '<br>');
                    } else {
                        cur.insertAdjacentText('beforebegin', ch);
                    }
                    activeTimer = setTimeout(tick, speed + (Math.random() * 16 - 8));
                } else {
                    cur.remove();
                    done && done();
                }
            }
            tick();
        }

        function runStep(index) {
            if (index >= STEPS.length) {
                // Mostrar gato
                document.getElementById('catWrap').classList.add('visible');
                activeTimer = setTimeout(fadeAll, 30000);
                return;
            }
            const step = STEPS[index];
            const el = document.getElementById(step.id);

            activeTimer = setTimeout(() => {
                el.classList.add('line-visible');
                if (step.text === null) {
                    runStep(index + 1);
                } else {
                    el.textContent = '';
                    typeInto(el, step.text, step.speed, () => runStep(index + 1));
                }
            }, step.pause);
        }

        function startSequence() {
            clearTimeout(activeTimer);
            document.getElementById('replayBtn').classList.remove('visible');
            document.getElementById('catWrap').classList.remove('visible');

            const msg = document.getElementById('flowerMsg');
            msg.style.opacity = '1';
            msg.style.display = 'flex';

            STEPS.forEach(s => {
                const el = document.getElementById(s.id);
                el.classList.remove('line-visible');
                if (s.id === 'divider') el.innerHTML = '✦ &nbsp; ✦ &nbsp; ✦';
                else el.textContent = '';
            });

            setTimeout(() => runStep(0), 120);
        }

        function fadeAll() {
            const msg = document.getElementById('flowerMsg');
            msg.style.transition = 'opacity 2s ease';
            msg.style.opacity = '0';
            setTimeout(() => {
                msg.style.display = 'none';
                document.getElementById('replayBtn').classList.add('visible');
            }, 2000);
        }

        window.addEventListener('load', () => {
            setTimeout(startSequence, 3000);
        });
    </script>
